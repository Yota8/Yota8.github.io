<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
(function() {
    let btcWs, ethWs, charts = {};
    const syms = ['BTCUSDT', 'ETHUSDT'];

    function getOpt(s, n) {
        return {
            title: { 
                text: s + ' Inflow vs Outflow (' + n + ')', 
                left: 'center', 
                top: '2%', 
                textStyle: { fontSize: 20, fontWeight: 'bold', color: '#2c3e50' } 
            },
            tooltip: { 
                trigger: 'item', 
                padding: 10, 
                backgroundColor: 'rgba(255,255,255,0.95)', 
                formatter: '{b}<br/><b>{c}</b> ({d}%)' 
            },
            legend: { bottom: '2%', icon: 'circle' },
            series: [{
                name: 'Market Sentiment',
                type: 'pie', 
                radius: ['45%', '72%'],
                itemStyle: { borderRadius: 12, borderColor: '#fff', borderWidth: 4 },
                label: { show: true, position: 'outside', formatter: '{b}\n{d}%', fontSize: 13, color: '#555' },
                data: [
                    {value:0, name:'Inflow (Buy)', itemStyle:{color:'#26a69a'}}, 
                    {value:0, name:'Outflow (Sell)', itemStyle:{color:'#ef5350'}}
                ]
            }]
        };
    }

    async function up(p) {
        if (btcWs) btcWs.close(); if (ethWs) ethWs.close();
        for (const s of syms) {
            const c = charts[s]; if (!c) continue;
            c.showLoading({ text: 'Loading...', color: '#26a69a', textColor: '#26a69a' });
            
            if (p === 'live') {
                let b=0, se=0;
                const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${s.toLowerCase()}@trade`);
                if (s === 'BTCUSDT') btcWs = ws; else ethWs = ws;
                ws.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    d.m ? se += parseFloat(d.q) : b += parseFloat(d.q);
                    c.setOption({series:[{data:[{value:b.toFixed(3), name:'Inflow (Buy)'},{value:se.toFixed(3), name:'Outflow (Sell)'}]}]});
                };
                c.setOption(getOpt(s, 'Live'));
            } else {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${s}&interval=${p}&limit=1`);
                    const data = await res.json();
                    const k = data[0];
                    const buy = parseFloat(k[9]), total = parseFloat(k[5]);
                    c.setOption(getOpt(s, p.toUpperCase()));
                    c.setOption({series:[{data:[{value:buy.toFixed(2), name:'Inflow (Buy)'},{value:(total-buy).toFixed(2), name:'Outflow (Sell)'}]}]});
                } catch(e) { console.error("Error:", e); }
            }
            c.hideLoading();
        }
    }

    window.addEventListener('load', () => {
        syms.forEach(s => {
            const dom = document.getElementById(s === 'BTCUSDT' ? 'btc-chart' : 'eth-chart');
            if(dom) charts[s] = echarts.init(dom);
        });
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                up(this.dataset.p);
            };
        });
        
        // 默认加载 1分钟数据
        up('1m'); 
    });
})();
</script>
